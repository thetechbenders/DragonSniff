name: Publish container

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_candidate:
        description: Publish an immutable SHA-tagged release-candidate image from this ref
        required: true
        default: false
        type: boolean
      promotion_target:
        description: Promote an already-verified immutable image
        required: true
        default: none
        type: choice
        options:
          - none
          - version
          - latest
      release_version:
        description: Version tag for promotion, for example v0.4.0
        required: false
        type: string
      release_sha:
        description: Exact 40-character release commit SHA for promotion
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-container-main
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/thetechbenders/dragonsniff

jobs:
  publish:
    name: Publish GHCR image
    if: >-
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && inputs.release_candidate)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=long

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote:
    name: Promote verified image
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.promotion_target != 'none'
    uses: ./.github/workflows/promote-container.yml
    with:
      promotion_target: ${{ inputs.promotion_target }}
      release_version: ${{ inputs.release_version }}
      release_sha: ${{ inputs.release_sha }}
    secrets: inherit
